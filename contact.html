<head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Contact | Izzie Del Pego</title> <link rel="preconnect" href="https://fonts.googleapis.com" /> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet" /> <style> :root { --ink: #151327; --muted: #6d6a8f; --paper: #fff8eb; --band: #a1112f; --band-2: #ef476f; --band-3: #ff9f1c; --accent-1: #3a86ff; --accent-3: #ff006e; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: "Montserrat", sans-serif; color: var(--ink); background: radial-gradient(circle at 10% 5%, rgba(255, 214, 102, 0.3), transparent 22%), radial-gradient(circle at 90% 0%, rgba(58, 134, 255, 0.16), transparent 24%), var(--paper); line-height: 1.45; } .site-header { background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 248, 235, 0.95)); border-bottom: 5px solid rgba(255, 159, 28, 0.45); padding: 3.35rem 1rem 1.45rem; text-align: center; position: relative; overflow: hidden; isolation: isolate; } .site-header::before { content: ""; position: absolute; inset: -4% -2% 0; z-index: -1; pointer-events: none; opacity: 0.78; background: radial-gradient(ellipse at 8% 22%, rgba(58, 134, 255, 0.2) 0 11%, transparent 12%), radial-gradient(ellipse at 89% 18%, rgba(255, 0, 110, 0.2) 0 10%, transparent 11%), radial-gradient(ellipse at 18% 78%, rgba(6, 214, 160, 0.18) 0 12%, transparent 13%), radial-gradient(ellipse at 84% 72%, rgba(255, 190, 11, 0.2) 0 12%, transparent 13%), repeating-linear-gradient(13deg, rgba(255, 111, 97, 0.34) 0 5px, transparent 5px 18px), repeating-linear-gradient(-17deg, rgba(58, 134, 255, 0.3) 0 4px, transparent 4px 16px), repeating-linear-gradient(31deg, rgba(6, 214, 160, 0.24) 0 4px, transparent 4px 20px); } .site-header::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.84)); } .site-title { font-size: clamp(1.45rem, 6.1vw, 3.1rem); font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 2rem; color: #271f49; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85); position: relative; display: inline-block; padding: 0.1rem 0.75rem; border-radius: 999px; background: rgba(255, 255, 255, 0.72); border: 2px solid rgba(39, 31, 73, 0.08); } .site-nav { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; } .site-nav a { text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; font-size: 0.86rem; color: var(--muted); padding: 0.3rem 0.6rem; border-radius: 999px; transition: color 140ms ease, background 140ms ease, transform 140ms ease; } .site-nav a:hover, .site-nav a.active { color: #ffffff; background: linear-gradient(90deg, #ff006e, #3a86ff); transform: translateY(-1px); } .page-band { background: radial-gradient(circle at 8% 20%, rgba(255, 255, 255, 0.14), transparent 28%), radial-gradient(circle at 90% 10%, rgba(255, 255, 255, 0.12), transparent 24%), linear-gradient(145deg, var(--band), var(--band-2) 55%, var(--band-3)); padding: 1.35rem; min-height: 60vh; } .contact-shell { max-width: 780px; margin: 0 auto; background: rgba(255, 255, 255, 0.9); border: 2px solid rgba(255, 255, 255, 0.35); border-radius: 18px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); padding: 1rem; color: #1d1d1d; } .contact-shell h1 { font-size: clamp(1.6rem, 5vw, 2.4rem); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.06em; color: #241f43; } .contact-shell p { margin-bottom: 0.85rem; font-size: 0.98rem; } .contact-form { display: grid; gap: 0.68rem; } label { font-weight: 700; font-size: 0.92rem; color: #221d3f; } input, textarea { width: 100%; font: inherit; border: 2px solid rgba(36, 31, 67, 0.2); border-radius: 10px; padding: 0.62rem 0.7rem; background: #fff; color: #202020; } textarea { min-height: 160px; resize: vertical; } .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-top: 0.2rem; } button, .direct-link { border: 0; text-decoration: none; cursor: pointer; background: linear-gradient(90deg, var(--accent-1), var(--accent-3)); color: #fff; border-radius: 999px; padding: 0.55rem 0.9rem; font-size: 0.92rem; font-weight: 700; display: inline-block; } .direct-link { background: #2a2740; } .help { margin-top: 0.65rem; font-size: 0.88rem; color: #4d4a65; } @media (min-width: 760px) { .site-header { padding-top: 4.6rem; } .site-nav { gap: 2.4rem; } .site-nav a { font-size: 0.82rem; } .page-band { padding: 1.65rem 1.65rem 2.7rem; } .contact-shell { padding: 1.25rem 1.2rem; } } </style>

<body> <header class="site-header"> <h1 class="site-title">Izzie Del Pego</h1> <nav class="site-nav" aria-label="Site sections"> <a href="index.html">About</a> <a href="performance.html">Performance</a> <a href="costuming.html">Costuming</a> <a class="active" href="contact.html">Contact</a> </nav> </header> <main class="page-band"> <section class="contact-shell"> <h1>Contact</h1> <p>Type your message below, then click <strong>Open Email Draft</strong> to send it to <strong>izziedelpego@gmail.com</strong>.</p> <form class="contact-form" id="contact-form"> <div> <label for="name">Your Name</label> <input id="name" name="name" type="text" placeholder="Enter your name" /> </div> <div> <label for="email">Your Email</label> <input id="email" name="email" type="email" placeholder="Enter your email" /> </div> <div> <label for="subject">Subject</label> <input id="subject" name="subject" type="text" placeholder="Enter a subject" required /> </div> <div> <label for="message">Message</label> <textarea id="message" name="message" placeholder="Type your message here" required></textarea> </div> <div class="actions"> <button type="submit">Open Email Draft</button> <a class="direct-link" href="mailto:izziedelpego@gmail.com">Direct Email Link</a> </div> </form> <p class="help">This opens your default mail app with your message prefilled.</p> </section> </main> <script> const form = document.getElementById('contact-form'); form.addEventListener('submit', (event) => { event.preventDefault(); const name = document.getElementById('name').value.trim(); const email = document.getElementById('email').value.trim(); const subject = document.getElementById('subject').value.trim(); const message = document.getElementById('message').value.trim(); const intro = [ name ? `Name: ${name}` : '', email ? `Email: ${email}` : '', ].filter(Boolean).join('\n'); const body = [intro, message].filter(Boolean).join('\n\n'); const mailto = `mailto:izziedelpego@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; window.location.href = mailto; }); </script>
