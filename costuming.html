<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Costuming | Izzie Del Pego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Bungee&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #ffbe0b;
      --bg-2: #fb5607;
      --bg-3: #ff006e;
      --ink: #1b1b1b;
      --card: rgba(255, 255, 255, 0.87);
      --shadow: rgba(27, 27, 27, 0.24);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Fredoka", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.4), transparent 30%),
        radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.35), transparent 25%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 50%, var(--bg-3));
      padding: 1.2rem;
      overflow: hidden;
    }

    main {
      width: min(94vw, 760px);
      background: var(--card);
      border-radius: 28px;
      border: 3px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 44px var(--shadow);
      padding: 1.25rem 1rem 1.5rem;
      text-align: center;
      animation: pop-in 650ms ease-out both;
    }

    nav {
      display: flex;
      gap: 0.45rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tab {
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid rgba(27, 27, 27, 0.15);
      border-radius: 999px;
      padding: 0.45rem 0.78rem;
      font-weight: 600;
      font-size: 0.92rem;
      transition: transform 160ms ease;
    }

    .tab:hover { transform: translateY(-1px); }
    .tab.active { background: #1b1b1b; color: #fff; border-color: #1b1b1b; }

    h1 {
      font-family: "Bungee", cursive;
      font-size: clamp(1.8rem, 9vw, 3.8rem);
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #8338ec, 0 6px 0 #3a86ff, 0 10px 18px rgba(0, 0, 0, 0.2);
      line-height: 1.02;
      margin-bottom: 0.85rem;
    }

    p {
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      max-width: 34ch;
      margin: 0 auto;
      font-weight: 500;
    }

    .swatches {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(110px, 1fr));
      gap: 0.5rem;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .swatch {
      padding: 0.55rem 0.45rem;
      border-radius: 14px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .s1 { background: #ff006e; }
    .s2 { background: #3a86ff; }
    .s3 { background: #8338ec; }
    .s4 { background: #fb5607; }

    @keyframes pop-in {
      from { transform: translateY(18px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @media (min-width: 760px) {
      main { padding: 1.55rem 2rem 2rem; }
      .tab { font-size: 1rem; }
      .swatches { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Site sections">
      <a class="tab" href="index.html">Home</a>
      <a class="tab" href="performance.html">Performance</a>
      <a class="tab active" href="costuming.html">Costuming</a>
    </nav>
    <h1>Costuming</h1>
    <p>Every look is designed to pop: playful color, bold texture, and dramatic style that owns the spotlight.</p>
    <div class="swatches" aria-label="Color palette highlights">
      <div class="swatch s1">Sparkle</div>
      <div class="swatch s2">Stage Blue</div>
      <div class="swatch s3">Velvet Pop</div>
      <div class="swatch s4">Fire Glow</div>
    </div>
  </main>
</body>
</html>
